[package]
authors = ["Corentin Henry <corentinhenry@gmail.com>"]
name = "netlink-packet-audit"
version = "0.7.1"
edition = "2021"

keywords = ["netlink", "linux"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/rust-netlink/netlink-packet-audit"
description = "netlink packet types"

[dependencies]
bitflags = "2"
bytes = "1.0"
log = "0.4.8"
netlink-packet-core = "0.9.0"
netlink-proto = { default-features = false, version = "0.14.1" }
zerocopy = { version = "0.8", features = ["derive"] }

[patch.crates-io]
netlink-packet-audit = { path = "." }
